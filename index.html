<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notatnik">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Notatnik studiów</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f2f2f7;--card:#fff;--fill:rgba(120,120,128,.12);
  --text:#000;--muted:#6e6e73;--sep:rgba(60,60,67,.16);
  --accent:#007aff;--ok:#34c759;--warn:#ff9500;--danger:#ff3b30;
  --kW:#007aff;--kC:#34c759;--kL:#ff3b30;
  --bar:#f7f7f9;--shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.24);
  --text:#fff;--muted:#98989f;--sep:rgba(84,84,88,.55);
  --accent:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--danger:#ff453a;
  --kW:#0a84ff;--kC:#30d158;--kL:#ff453a;--bar:#121214;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bar);color:var(--text)}
html{overflow:hidden}
body{overflow:visible}
body{position:fixed;inset:0;font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}
/* app shell: header and tab bar never move, only the middle scrolls */
#app{position:absolute;top:0;left:0;right:0;height:calc(100% + var(--nudge,0px));display:flex;flex-direction:column}
.hdr{flex:none;background:var(--bar);padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;border-bottom:.5px solid var(--sep);z-index:2}
.hdr-in{max-width:1240px;margin:0 auto}
#scroller{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:var(--bg)}
.wrap{max-width:1272px;margin:0 auto;padding:0 16px 96px}
@media (min-width:740px){.wrap{padding:0 20px 96px}.hdr{padding-left:20px;padding-right:20px}}
.tabbar{flex:none;background:var(--bar);border-top:.5px solid var(--sep);padding-bottom:max(calc(env(safe-area-inset-bottom) - 20px),4px);z-index:2}
.vp-short .tabbar{padding-bottom:2px}
.tabbar-in{max-width:640px;margin:0 auto;display:flex}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 1px;font-size:10px;font-weight:500;color:var(--muted);position:relative}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.tabbar .dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.tabbar .dot.run{background:var(--ok);min-width:10px;width:10px;height:10px;top:6px;padding:0}
/* header */
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.hdr h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.weeknav .lbl{font-weight:600;font-size:17px;text-align:center;flex:1}
.weeknav .lbl small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--accent);flex:none}
.iconbtn:active{background:var(--fill)}
.iconbtn svg{width:22px;height:22px}
.pillbtn{color:var(--accent);font-weight:600;font-size:15px;padding:6px 12px;border-radius:16px;background:var(--fill)}
/* cards */
.sec{margin:18px 0 6px;padding:0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.daycard{margin-top:14px}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 8px 8px 14px}
.dayhead b{font-size:18px;min-width:0}
.dayhead .badge{white-space:nowrap}
button.dayhead{width:100%;text-align:left;color:inherit}
button.dayhead .dd svg{opacity:.6}
.dayfoot{color:var(--accent);font-weight:600;font-size:15px}
.dayfoot .bd{flex:1;display:flex;align-items:center;gap:8px}
.dchip-count{font-size:11px;font-weight:700;color:#fff;border-radius:8px;padding:2px 7px}
.backbtn{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;margin-left:-8px;padding:4px 6px}
.backbtn svg{width:24px;height:24px}
.tl-b.daily{border-left-style:solid;border-radius:10px}
.dayhead .dd{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:4px}
.dayhead .addday{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--accent);background:var(--fill)}
.dayhead .addday svg{width:18px;height:18px}
.daycard.today .dayhead b{color:var(--accent)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:8px;background:var(--accent);color:#fff !important;margin-left:6px;vertical-align:3px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left}
.row+.row::before,.row.sepTop::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
button.row:active,.row.tap:active{background:var(--fill)}
.cls{align-items:stretch}
.cls .bar{width:4px;border-radius:2px;flex:none}
.cls .bd{flex:1;min-width:0;display:block;text-align:left}
.cls .bd>span{display:block}
.cls .bd>.t1{display:flex;justify-content:space-between;gap:8px}
.cls .name{font-weight:600}
.cls .time{color:var(--muted);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cls .meta{font-size:13px;color:var(--muted);margin-top:1px}
.cls .bd>.prev{font-size:14px;color:var(--text);opacity:.85;margin-top:4px;max-height:2.9em;overflow:hidden;white-space:pre-line;word-break:break-word}
.cls .prev.ph{color:var(--accent);opacity:1}
.kind{font-size:11px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:4px;color:#fff}
.chev{color:var(--muted);opacity:.5;align-self:center;flex:none}
.duechips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:14px;background:var(--fill);text-align:left}
.chip i{width:8px;height:8px;border-radius:4px;display:inline-block;flex:none}
.chip.done{opacity:.45;text-decoration:line-through}
.empty-note{color:var(--muted);font-size:14px;padding:4px 14px 14px}
.daynote{color:var(--muted)}
.daynote .bd{flex:1}
.banner{margin-top:14px;border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,rgba(255,149,0,.18),rgba(255,59,48,.12));border:.5px solid rgba(255,149,0,.35)}
.banner b{display:block;margin-bottom:4px}
.banner .chip{margin:4px 6px 0 0;background:var(--card)}
.install{margin-top:14px;border-radius:14px;padding:12px 14px;background:var(--card);border:.5px dashed var(--accent);font-size:14px}
/* tasks */
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;margin:0 -16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;font-size:14px;font-weight:600;padding:7px 12px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.fchip i{width:8px;height:8px;border-radius:4px}
.fchip.on{background:var(--text);color:var(--bg)}
.fchip small{opacity:.6;font-weight:500}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-top:10px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:14px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.task{align-items:flex-start}
.check{width:26px;height:26px;border-radius:13px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;margin-top:1px;transition:.15s}
.check.on{background:var(--ok);border-color:var(--ok)}
.check svg{width:15px;height:15px;color:#fff;opacity:0}
.check.on svg{opacity:1}
.task .bd{flex:1;min-width:0}
.task .ttl{font-weight:500;word-break:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.task .sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tpill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff}
.due-over{color:var(--danger);font-weight:600}
.due-soon{color:var(--warn);font-weight:600}
.bell{width:18px;height:18px;color:var(--muted);flex:none;margin-top:4px}
.bell.on{color:var(--ok)}
.fab{position:fixed;right:max(20px,calc(50% - 410px));bottom:calc(var(--tabh,52px) - var(--nudge,0px) + 14px);width:58px;height:58px;border-radius:29px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,122,255,.4);z-index:15}
.fab svg{width:28px;height:28px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;text-decoration:none;text-align:center}
.bigbtn.sec2{background:var(--fill);color:var(--accent)}
.bigbtn.danger{background:var(--fill);color:var(--danger)}
.bigbtn.green{background:var(--ok)}
.bigbtn:active{opacity:.8}
.bigbtn svg{width:20px;height:20px;flex:none}
.progress{height:6px;background:var(--fill);border-radius:3px;overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.quickadd{display:flex;gap:8px;padding:8px 14px 12px}
.quickadd input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:10px;padding:9px 12px;outline:none}
.quickadd button{color:var(--accent);font-weight:600;padding:0 6px}
.smallbtn{font-size:13px;font-weight:600;color:var(--accent);padding:6px 10px;border-radius:12px;background:var(--fill);flex:none}
.deadline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);padding:0 14px 8px}
.deadline .dl{text-align:left;display:inline-flex;align-items:center;gap:5px;color:var(--text);font-weight:600;background:rgba(255,59,48,.12);border-radius:8px;padding:3px 8px}
.deadline .dl i{width:8px;height:8px;border-radius:4px}
/* month */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 6px}
.mhead b{font-size:17px;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mwd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.mcell{min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:4px}
.mcell .n{font-size:15px;width:30px;height:30px;display:grid;place-items:center;border-radius:15px;font-variant-numeric:tabular-nums}
.mcell.today .n{color:var(--accent);font-weight:700}
.mcell.sel .n{background:var(--accent);color:#fff;font-weight:700}
.mcell.out{opacity:.3}
.mdots{display:flex;gap:3px;margin-top:3px;height:6px}
.mdots i{width:6px;height:6px;border-radius:3px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:4px}
/* day picker */
.dpick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{padding:6px 0;border-radius:10px;background:var(--card);text-align:center;font-size:12px;line-height:1.2;border:2px solid transparent}
.dchip b{display:block;font-size:16px}
.dchip.on{background:var(--ok);color:#fff}
.dchip.due{border-color:var(--danger)}
.dchip.blank{background:none}
.dquick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
/* study */
.timer{display:flex;flex-direction:column;align-items:center;padding:18px 14px 16px}
.ring{position:relative;width:240px;height:240px;max-width:72vw;max-height:72vw}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .tt{font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .ph{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.ring .sj{font-size:13px;color:var(--muted);max-width:170px;text-align:center;margin-top:2px}
.cycdots{display:flex;gap:8px;margin:14px 0 4px}
.cycdots i{width:10px;height:10px;border-radius:5px;background:var(--fill)}
.cycdots i.done{background:var(--ok)}
.cycdots i.cur{background:var(--accent)}
.btnrow{display:flex;gap:10px;width:100%;margin-top:12px}
.btnrow>*{flex:1}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--card);border-radius:14px;padding:14px;border:2px solid transparent;text-align:left}
.mode.on{border-color:var(--accent)}
.mode b{font-size:22px;display:block}
.mode span{font-size:13px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:34px;height:34px;border-radius:17px;background:var(--fill);color:var(--accent);font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper b{min-width:20px;text-align:center;font-size:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{font-size:26px;display:block}
.stat span{font-size:13px;color:var(--muted)}
.sbar{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:14px}
.sbar .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .tr{width:38%;height:8px;background:var(--fill);border-radius:4px;overflow:hidden}
.sbar .tr div{height:100%;background:var(--accent);border-radius:4px}
.sbar .mn{width:52px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.guide{font-size:14px;line-height:1.5;padding:4px 14px 14px}
.guide ol{padding-left:20px;margin:6px 0}
.guide li{margin:6px 0}
.guide code{background:var(--fill);border-radius:5px;padding:1px 5px;font-size:13px}
.statusok{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ok)}
.statusok svg{width:20px;height:20px}
/* sheets */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);transition:background .25s;display:flex;align-items:flex-end;justify-content:center}
.ov.in{background:rgba(0,0,0,.4)}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;max-height:94dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.ov.in .sheet{transform:none}
.sheet.full{height:94vh;height:94dvh}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:14px;max-height:88vh}.sheet.full{height:88vh}}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 10px;border-bottom:.5px solid var(--sep)}
.sh-head .txtbtn{color:var(--accent);font-size:17px;padding:4px;min-width:70px;text-align:left}
.sh-head .txtbtn.r{text-align:right;font-weight:600}
.sh-title{text-align:center;font-weight:600;font-size:17px;flex:1;min-width:0}
.sh-title small{display:block;font-weight:400;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 16px calc(24px + env(safe-area-inset-bottom));flex:1}
.field{margin-top:14px}
.field>label{display:block;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:0 4px 6px}
.inp{width:100%;border:0;background:var(--card);border-radius:10px;padding:11px 12px;outline:none;-webkit-appearance:none;appearance:none}
textarea.inp{resize:none;min-height:110px;line-height:1.45}
textarea.note{min-height:220px}
.inrow{display:flex;gap:8px}
.inrow>*{flex:1;min-width:0}
input[type=date].inp,input[type=time].inp{min-height:44px}
.typegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typebtn{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:12px;background:var(--card);font-weight:600;font-size:15px;border:2px solid transparent;text-align:left}
.typebtn i{width:12px;height:12px;border-radius:6px;flex:none}
.typebtn.on{border-color:currentColor}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:10px;padding:10px 12px}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--fill);border-radius:16px;transition:.2s}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}
.hint{font-size:13px;color:var(--muted);margin:6px 4px 0;line-height:1.4}
.remcard{background:var(--card);border-radius:12px;padding:12px}
.remcard .st{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.remcard .st svg{width:20px;height:20px;flex:none}
/* attachments */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.att-tile{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.att-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.att-tile .ext{font-weight:800;font-size:13px;color:#fff;background:var(--accent);border-radius:6px;padding:4px 6px;margin-bottom:6px}
.att-tile .fn{font-size:11px;line-height:1.2;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.att-btns{display:flex;gap:8px;margin-top:8px}
.att-btns label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--card);color:var(--accent);font-weight:600;font-size:15px;cursor:pointer}
.att-btns label svg{width:20px;height:20px}
.att-btns input{display:none}
.att-count{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);margin-left:6px}
.att-count svg{width:13px;height:13px}
.viewer{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;color:#fff}
.viewer .vh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.viewer .vh button{color:#0a84ff;font-size:17px;padding:6px}
.viewer .vh div{flex:1;text-align:center;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer .vb{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.viewer .vb img,.viewer .vb video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vb iframe{width:100%;height:100%;border:0;background:#fff}
.viewer .vf{display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.viewer .vf button{flex:1;padding:12px;border-radius:12px;background:#1c1c1e;font-weight:600}
.viewer .nopv{text-align:center;padding:24px;color:#aaa;font-size:15px}
.acts{width:100%;max-width:520px;padding:0 10px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s}

.mt{margin-top:14px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:15px}
.schedrow .bd{flex:1}

.dsb{display:flex;flex-direction:column;align-items:center;padding:4px 0 3px;border-radius:12px;font-size:11px;color:var(--muted);font-weight:600}

<body>
<div id="app">
  <header class="hdr"><div class="hdr-in" id="hdr"></div></header>
  <main id="scroller"><div class="wrap" id="view"></div></main>
  <nav class="tabbar"><div class="tabbar-in" id="tabs"></div></nav>
</div>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const SC=()=>$('#scroller');
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs||{})){
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked')e[k]=v;
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(9)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}
  return e;
}
const svg=(p,extra='')=>h('span',{html:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`}).firstChild;
const IC={
  left:'<path d="M15 18l-6-6 6-6"/>',right:'<path d="M9 18l6-6-6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>',
  bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>',
  cam:'<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>',
  clip:'<path d="M21.4 11.1l-9.2 9.2a6 6 0 01-8.5-8.5l9.2-9.2a4 4 0 015.7 5.7l-9.2 9.2a2 2 0 01-2.8-2.8l8.5-8.5"/>',
  week:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7 13h2M11 13h2M15 13h2M7 17h2M11 17h2"/>',
  tasks:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/>',
  plan:'<path d="M4 20h16M6 16l4-4 3 3 6-7"/><path d="M15 8h4v4"/>',
  study:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6M12 2v3"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',
  share:'<path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/>',
  ok:'<circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/>',
  moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>',
  play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',
};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const todayISO=()=>iso(new Date());
const tomorrowISO=()=>iso(addDays(new Date(),1));
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const MONTHS=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const DAYS=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];
const DSHORT=['Pn','Wt','Śr','Cz','Pt','So','Nd'];
const dowOf=s=>(parseD(s).getDay()+6)%7;
const dshort=s=>{const d=parseD(s);return `${DSHORT[dowOf(s)]} ${d.getDate()} ${MON[d.getMonth()]}`;};
const dlong=s=>{const d=parseD(s);return `${DAYS[dowOf(s)]}, ${d.getDate()} ${MON[d.getMonth()]}`;};
const dayDiff=s=>Math.round((parseD(s)-parseD(todayISO()))/864e5);
const weekStart=off=>addDays(monday(new Date()),off*7);
const weekDates=off=>{const m=weekStart(off);return[...Array(7)].map((_,i)=>iso(addDays(m,i)));};
function rangeLabel(m){const s=addDays(m,6);return m.getMonth()===s.getMonth()?`${m.getDate()}–${s.getDate()} ${MON[m.getMonth()]}`:`${m.getDate()} ${MON[m.getMonth()]} – ${s.getDate()} ${MON[s.getMonth()]}`;}
function relDue(s){
  const n=dayDiff(s);
  if(n===0)return'Dziś';if(n===1)return'Jutro';if(n===2)return'Pojutrze';if(n===-1)return'Wczoraj';
  if(n<0)return `${dshort(s)} (${-n} dni temu)`;
  return dshort(s);
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const tmin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b;};
const fmtT=t=>t?t.replace(/^0/,''):'';
const addMin=(t,m)=>{const x=tmin(t)+m;return `${pad(Math.floor(x/60)%24)}:${pad(x%60)}`;};
const fmtMin=m=>m>=60?`${Math.floor(m/60)} h ${m%60?m%60+' min':''}`.trim():`${m} min`;
function debounce(fn,ms){let t;const f=(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};f.flush=(...a)=>{clearTimeout(t);return fn(...a);};return f;}
function autosize(t){const f=()=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,parseInt(getComputedStyle(t).minHeight)||0)+'px';};t.addEventListener('input',f);requestAnimationFrame(f);return t;}

/* ---------- storage ---------- */
let dbp;
function idb(){return dbp||(dbp=new Promise((res,rej)=>{
  const r=indexedDB.open('notatnik-studiow',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('notes',{keyPath:'key'});d.createObjectStore('tasks',{keyPath:'id'});d.createObjectStore('files',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
}));}
async function tx(store,mode,fn){const d=await idb();return new Promise((res,rej)=>{
  const t=d.transaction(store,mode),s=t.objectStore(store);let out;const r=fn(s);
  if(r)r.onsuccess=()=>{out=r.result;};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
const dbPut=(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));

/* ---------- data ---------- */
const KINDS={W:{label:'Wykład',short:'W',color:'var(--kW)'},C:{label:'Ćwiczenia',short:'Ćw',color:'var(--kC)'},L:{label:'Laboratorium',short:'Lab',color:'var(--kL)'}};
const TYPES={
  hw:{label:'Zadanie domowe',color:'#007aff'},
  quiz:{label:'Kartkówka',color:'#ff9500'},
  group:{label:'Praca w grupie',color:'#af52de'},
  pres:{label:'Prezentacja',color:'#5e5ce6'},
  colloq:{label:'Kolokwium',color:'#ff3b30'},
  exam:{label:'Egzamin',color:'#c2185b'},
  todo:{label:'Do zrobienia',color:'#8e8e93'},
  daily:{label:'Codzienne',color:'#30b0c7'},
};
const DEFAULT_SCHEDULE=[
  {id:'c1',day:0,start:'08:00',end:'09:30',name:'Matematyka',kind:'W',room:'3P'},
  {id:'c2',day:0,start:'09:45',end:'11:15',name:'Zarządzanie',kind:'W',room:'3P'},
  {id:'c3',day:1,start:'08:00',end:'09:30',name:'Rachunkowość',kind:'W',room:'3P'},
  {id:'c4',day:1,start:'09:45',end:'11:15',name:'Zarządzanie',kind:'C',room:'104E'},
  {id:'c5',day:1,start:'11:30',end:'13:00',name:'Wprowadzenie do mikroekonomii',kind:'C',room:'308E'},
  {id:'c6',day:1,start:'15:00',end:'16:30',name:'Technologie cyfrowe',kind:'L',room:'109D'},
  {id:'c7',day:2,start:'09:00',end:'11:15',name:'Finanse',kind:'W',room:'3P'},
  {id:'c8',day:2,start:'11:30',end:'13:00',name:'Wprowadzenie do mikroekonomii',kind:'W',room:'3P'},
  {id:'c9',day:3,start:'08:00',end:'09:30',name:'Prawo',kind:'W',room:'3P'},
  {id:'c10',day:3,start:'13:15',end:'14:45',name:'Rachunkowość',kind:'C',room:'11A'},
  {id:'c11',day:3,start:'15:00',end:'16:30',name:'Matematyka',kind:'C',room:'203C'},
];
const DEFAULT_SETTINGS={remindTime:'18:00',morning:false,weekend:false,autoPlan:true,barNudge:0};
const S={tab:'week',weekOff:0,
  taskView:'list',taskWeekOff:0,taskMonthOff:0,taskSel:null,filter:'all',showDone:false,
  planView:'week',planOff:0,planOpenDay:null,planMonthOff:0,planSel:null,
  settings:{...DEFAULT_SETTINGS},schedule:[],tasks:[],notes:new Map(),study:[]};

function migrateTask(t){
  let changed=false;
  if(!Array.isArray(t.sessions)){t.sessions=t.plan?[{id:uid(),date:t.plan,done:!!t.done}]:[];changed=true;}
  if('plan'in t){delete t.plan;changed=true;}
  return[t,changed];
}
async function load(){
  S.settings={...DEFAULT_SETTINGS,...(await dbGet('kv','settings')||{})};
  S.schedule=await dbGet('kv','schedule');
  if(!S.schedule){S.schedule=DEFAULT_SCHEDULE.map(c=>({...c}));await dbPut('kv',S.schedule,'schedule');}
  S.tasks=[];
  for(const raw of await dbAll('tasks')){const[t,ch]=migrateTask(raw);if(ch)await dbPut('tasks',t);S.tasks.push(t);}
  S.notes=new Map((await dbAll('notes')).map(n=>[n.key,n]));
  S.study=await dbGet('kv','study')||[];
  try{const t=sessionStorage.getItem('tab');if(t&&['week','tasks','plan','settings'].includes(t))S.tab=t;}catch(e){}
}
const saveSettings=()=>dbPut('kv',S.settings,'settings');
const saveSchedule=()=>dbPut('kv',S.schedule,'schedule');
async function saveTask(t){await dbPut('tasks',t);const i=S.tasks.findIndex(x=>x.id===t.id);if(i>=0)S.tasks[i]=t;else S.tasks.push(t);}
async function deleteTask(t){for(const f of t.files||[])await dbDel('files',f);await dbDel('tasks',t.id);S.tasks=S.tasks.filter(x=>x.id!==t.id);}
async function saveNote(n){
  if(!n.text.trim()&&!n.files.length){await dbDel('notes',n.key);S.notes.delete(n.key);return;}
  n.updated=Date.now();await dbPut('notes',n);S.notes.set(n.key,n);
}
const subjects=()=>[...new Set(S.schedule.map(c=>c.name))].sort((a,b)=>a.localeCompare(b,'pl'));
const classesOn=day=>S.schedule.filter(c=>c.day===day).sort((a,b)=>tmin(a.start)-tmin(b.start));
const openTasks=()=>S.tasks.filter(t=>!t.done);
const isDeadline=t=>t.type!=='todo'&&t.type!=='daily'&&!!t.due;
const sortTasks=a=>a.sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999')||(x.time||'99').localeCompare(y.time||'99')||x.created-y.created);
function upcomingAlert(){const td=todayISO(),tm=tomorrowISO();return sortTasks(openTasks().filter(t=>isDeadline(t)&&t.due<=tm));}
function nextClass(subject,fromDate,kind){
  for(let i=1;i<=21;i++){const ds=iso(addDays(parseD(fromDate),i));const cl=classesOn(dowOf(ds)).filter(c=>c.name===subject);
    const c=cl.find(c=>!kind||c.kind===kind)||null;if(c)return{date:ds,time:c.start};}
  for(let i=1;i<=21;i++){const ds=iso(addDays(parseD(fromDate),i));const c=classesOn(dowOf(ds)).find(c=>c.name===subject);if(c)return{date:ds,time:c.start};}
  return null;
}
function defaultPlanDay(due){const td=todayISO();if(due<=td)return td;const prev=iso(addDays(parseD(due),-1));return prev<td?td:prev;}
const taskName=t=>t.title||TYPES[t.type].label;
const occursOn=(t,ds)=>{const r=t.repeat;return!!r&&ds>=r.from&&(r.days||[]).includes(dowOf(ds))&&!(r.skip||[]).includes(ds);};
const sessionsOn=ds=>{const out=[];for(const t of S.tasks){for(const s of t.sessions||[])if(s.date===ds)out.push([t,s]);
    if(occursOn(t,ds))out.push([t,{id:'r'+ds,date:ds,time:t.repeat.time||'',dur:t.repeat.dur||60,done:(t.repeat.doneDates||[]).includes(ds),virtual:true}]);}
  return out.sort((a,b)=>(a[1].time||'99').localeCompare(b[1].time||'99')||(a[0].due||'9999').localeCompare(b[0].due||'9999'));};
const needsPlanning=()=>{const td=todayISO();return sortTasks(openTasks().filter(t=>t.type!=='daily'&&!(t.sessions||[]).some(s=>s.date>=td)&&(t.type!=='todo'||(t.sessions||[]).length)));};

/* ---------- files ---------- */
const urlCache=new Map();
async function fileURL(id){if(urlCache.has(id))return urlCache.get(id);const f=await dbGet('files',id);if(!f)return null;const u=URL.createObjectURL(f.blob);urlCache.set(id,u);return u;}
async function compressImage(file,max=2200,q=.85){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const w=img.naturalWidth,hh=img.naturalHeight,s=Math.min(1,max/Math.max(w,hh));
    const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(hh*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!b||b.size>=file.size)return null;return b;
  }catch(e){return null}finally{URL.revokeObjectURL(url);}
}
async function storeFile(file){
  let blob=file,name=file.name||'plik',type=file.type||'application/octet-stream';
  if(/^image\/(jpeg|png|heic|heif|webp)$/.test(type)){const b=await compressImage(file);if(b){blob=b;type='image/jpeg';name=name.replace(/\.[^.]+$/,'')+'.jpg';}}
  const id=uid();await dbPut('files',{id,name,type,size:blob.size,blob,created:Date.now()});return id;
}
async function deleteFile(id){await dbDel('files',id);if(urlCache.has(id)){URL.revokeObjectURL(urlCache.get(id));urlCache.delete(id);}}
async function shareBlob(blob,name,type){
  const file=new File([blob],name,{type:type||blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e.name==='AbortError')return true;}}
  const a=h('a',{href:URL.createObjectURL(file),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);return true;
}
function attachBox(ids,onChange,{immediate=false}={}){
  const grid=h('div',{class:'att-grid'});
  const wrap=h('div',{},grid);
  async function add(files){
    for(const f of files){try{ids.push(await storeFile(f));}catch(e){toast('Nie udało się zapisać pliku');}}
    onChange&&onChange();draw();
  }
  const mk=(icon,label,accept)=>{const inp=h('input',{type:'file',multiple:true,accept,onchange:e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)add(fs);}});
    return h('label',{},svg(IC[icon]),label,inp);};
  wrap.append(h('div',{class:'att-btns'},mk('cam','Zdjęcie','image/*'),mk('clip','Plik',null)));
  async function draw(){
    grid.innerHTML='';
    for(const id of [...ids]){

    const dates=[];for(let x=parseD(start);iso(x)<=end;x=addDays(x,1))dates.push(iso(x));

    const times=(t.sessions||[]).length?h('div',{class:'strows'},h('div',{class:'hint',style:'margin:0 0 4px'},'Godzina pracy (opcjonalnie):'),

/* ---- ICS ---- */
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
const icsUTC=d=>`${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
function icsFold(line){const out=[];let cur='';const enc=new TextEncoder();for(const ch of line){if(enc.encode(cur+ch).length>73){out.push(cur);cur=' '+ch;}else cur+=ch;}out.push(cur);return out.join('\r\n');}
function icsDur(min){min=Math.max(0,Math.round(min));const d=Math.floor(min/1440),hh=Math.floor(min%1440/60),m=min%60;return `-P${d?d+'D':''}T${hh}H${m}M`;}
function buildIcs(tasks){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Notatnik studiow//PL','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Studia'];
  const now=icsUTC(new Date());
  for(const t of tasks){
    const ty=TYPES[t.type]||TYPES.todo;
    const[hh,mm]=(t.time||'08:00').split(':').map(Number);
    const start=parseD(t.due);start.setHours(hh,mm,0,0);
    const end=new Date(start.getTime()+(t.time?90:30)*6e4);
    const sum=`${ty.label}${t.subject?': '+t.subject:''}${t.title?' – '+t.title:''}`;
    const rem=parseD(t.due);rem.setDate(rem.getDate()-1);const[rh,rm]=S.settings.remindTime.split(':').map(Number);rem.setHours(rh,rm,0,0);
    L.push('BEGIN:VEVENT',`UID:${t.id}@notatnik-studiow`,`DTSTAMP:${now}`,`DTSTART:${icsUTC(start)}`,`DTEND:${icsUTC(end)}`,
      `SUMMARY:${icsEsc(sum)}`,`DESCRIPTION:${icsEsc([t.desc||'',t.time?'':'(godzina orientacyjna)'].filter(Boolean).join('\n'))}`,
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('Jutro: '+sum)}`,`TRIGGER:${icsDur((start-rem)/6e4)}`,'END:VALARM');
    if(S.settings.morning){const mo=parseD(t.due);mo.setHours(7,0,0,0);if(start-mo>=30*6e4)L.push('BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc('Dziś: '+sum)}`,`TRIGGER:${icsDur((start-mo)/6e4)}`,'END:VALARM');}
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function addToCalendar(tasks,after){
  tasks=tasks.filter(t=>t&&t.due);if(!tasks.length)return;
  const ics=buildIcs(tasks);
  const name=tasks.length===1?'przypomnienie.ics':'przypomnienia.ics';
  const dataUrl='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  const mark=async()=>{for(const t of tasks){const real=S.tasks.find(x=>x.id===t.id)||t;real.calAdded=true;t.calAdded=true;await saveTask(real);}after&&after();};
  const body=h('div',{},
    h('p',{style:'margin:4px 4px 14px;line-height:1.45'},`${tasks.length===1?'Termin zostanie dodany':'Terminy ('+tasks.length+') zostaną dodane'} do Kalendarza z alarmem `,h('b',{},`dzień wcześniej o ${fmtT(S.settings.remindTime)}`),S.settings.morning?' i rano w dniu terminu':'','. Powiadomienie przyjdzie z aplikacji Kalendarz — także gdy Notatnik jest zamknięty.'),
    h('a',{class:'bigbtn',href:dataUrl,onclick:()=>{setTimeout(mark,300);}},svg(IC.cal),'Otwórz w Kalendarzu'),
    h('div',{class:'hint',style:'margin:8px 4px 18px'},`W oknie, które się pojawi, stuknij „${tasks.length>1?'Dodaj wszystko':'Dodaj do kalendarza'}”.`),
    h('button',{class:'bigbtn sec2',onclick:async()=>{await shareBlob(new Blob([ics],{type:'text/calendar'}),name,'text/calendar');mark();}},svg(IC.share),'Nie zadziałało? Zapisz plik .ics'),
    h('div',{class:'hint',style:'margin:8px 4px 0'},'Zapisz plik w „Pliki”, a następnie stuknij go w aplikacji Pliki — iOS zaproponuje dodanie do Kalendarza.'),
    h('div',{class:'field'},h('button',{class:'bigbtn sec2',onclick:async()=>{await mark();s.close();render();toast('Oznaczono jako dodane');}},svg(IC.ok),'Już dodałem — oznacz')));
  const s=sheet({title:'Przypomnienie',body,left:'Zamknij',onClose:()=>{render();}});
}

/* ---- PLAN ---- */
const PLAN_START=7,PLAN_END=22,HOUR_PX=60,TL_LEFT=46;
const DURS=[15,30,45,60,90,120,150,180,240];
const durLabel=m=>m<60?`${m} min`:m%60?`${Math.floor(m/60)} h ${m%60} min`:`${m/60} h`;
const weekOffOf=ds=>Math.round((monday(parseD(ds))-monday(new Date()))/(7*864e5));
const isDaily=t=>t.type==='daily';
const schoolOn=ds=>sessionsOn(ds).filter(([t])=>!isDaily(t));
const dailyOn=ds=>sessionsOn(ds).filter(([t])=>isDaily(t));

  view.append(h('div',{class:'sec'},'Planowanie'),h('div',{class:'card',style:'padding:12px'},
    switchRow('Automatycznie planuj pracę dzień przed terminem',S.settings.autoPlan,async v=>{S.settings.autoPlan=v;await saveSettings();},'Nowe zadanie z terminem od razu pojawi się w zakładce Plan. Dni możesz zmienić w zadaniu.'),
    h('div',{style:'margin-top:10px'},switchRow('Zawsze pokazuj sobotę i niedzielę',S.settings.weekend,async v=>{S.settings.weekend=v;await saveSettings();}))));
  const nudgeVal=h('b',{},`${S.settings.barNudge} px`);
  const setNudge=async v=>{S.settings.barNudge=Math.max(-10,Math.min(60,v));applyLayout();nudgeVal.textContent=`${S.settings.barNudge} px`;await saveSettings();};
  view.append(h('div',{class:'sec'},'Wygląd'),h('div',{class:'card',style:'padding:12px 14px'},
    h('div',{style:'display:flex;align-items:center;justify-content:space-between;gap:12px'},h('div',{},h('b',{},'Dosuń dolny pasek'),h('div',{class:'muted',style:'font-size:13px'},'Jeśli pod paskiem zostaje szare miejsce, zwiększaj, aż zniknie.')),
      h('div',{class:'stepper'},h('button',{onclick:()=>setNudge(S.settings.barNudge-2)},'−'),nudgeVal,h('button',{onclick:()=>setNudge(S.settings.barNudge+2)},'+'))),
    h('div',{class:'hint'},'Na iOS 26.0 aplikacje z ekranu początkowego miały błąd z odstępem na dole — poprawiony w iOS 26.1. Warto też zaktualizować iOS.')));
  view.append(h('div',{class:'sec'},h('span',{},'Plan zajęć'),h('button',{class:'smallbtn',onclick:()=>editClass(null)},'＋ Dodaj')));
  const card=h('div',{class:'card'});
  for(let i=0;i<7;i++){const cl=classesOn(i);if(!cl.length)continue;
    card.append(h('div',{style:'padding:10px 14px 2px;font-size:13px;font-weight:700;color:var(--muted)'},DAYS[i].toUpperCase()));
    cl.forEach(c=>{const k=KINDS[c.kind];card.append(h('button',{class:'row cls schedrow',onclick:()=>editClass(c)},h('span',{class:'bar',style:`background:${k.color}`}),
      h('span',{class:'bd'},h('span',{class:'t1'},h('span',{class:'name'},c.name),h('span',{class:'time'},`${fmtT(c.start)}–${fmtT(c.end)}`)),h('span',{class:'meta'},h('span',{class:'kind',style:`background:${k.color}`},k.short),c.room?'sala '+c.room:'')),
      svg(IC.right,'class="chev" width="16" height="16"')));});
  }
  if(!S.schedule.length)card.append(h('div',{class:'empty'},'Brak zajęć w planie.'));
  view.append(card);
  view.append(h('div',{class:'sec'},'Kopia zapasowa i przenoszenie'),
    h('div',{class:'card',style:'padding:12px'},
      h('div',{class:'hint',style:'margin:0 2px 12px'},'Dane (notatki, zadania, zdjęcia, pliki) są zapisane tylko na tym urządzeniu. Aby przenieść je między iPhone’em a iPadem: wyeksportuj kopię, wyślij ją AirDropem i zaimportuj na drugim urządzeniu.'),
      h('button',{class:'bigbtn',onclick:exportBackup},svg(IC.share),'Eksportuj kopię'),
      h('label',{class:'bigbtn sec2',style:'margin-top:8px;cursor:pointer'},'Importuj kopię',h('input',{type:'file',accept:'.json,application/json',style:'display:none',onchange:e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f);}})),
      h('div',{id:'usage',class:'hint center',style:'margin-top:10px'})));
  view.append(h('div',{class:'sec'},'Aktualizacja'),h('div',{class:'card',style:'padding:12px 14px;font-size:14px;line-height:1.5'},
    'Nowa wersja pobiera się sama, gdy otworzysz aplikację z dostępem do internetu. Jeśli nie widzisz zmian: zamknij Notatnik w przełączniku aplikacji i otwórz go ponownie.',
    h('div',{style:'margin-top:10px'},h('button',{class:'smallbtn',onclick:async()=>{try{const r=await navigator.serviceWorker?.getRegistration();await r?.update();}catch(e){}location.reload();}},'Sprawdź aktualizację teraz'))));
  view.append(h('div',{class:'hint center',style:'margin:18px 0'},`Notatnik studiów · wersja ${APP_VERSION}`));
  if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const u=$('#usage');if(u)u.textContent=`Zajęte miejsce: ${(e.usage/1048576).toFixed(1)} MB`;});
}
const APP_VERSION='4.0';
function editClass(c){
  const isNew=!c;
  const d=c?{...c}:{id:uid(),day:0,start:'08:00',end:'09:30',name:'',kind:'W',room:''};
  const kseg=h('div',{class:'seg',style:'margin:0'});
  const drawK=()=>kseg.replaceChildren(...Object.entries(KINDS).map(([k,v])=>h('button',{class:d.kind===k?'on':'',onclick:()=>{d.kind=k;drawK();}},v.label)));drawK();
  const daySel=h('select',{class:'inp',onchange:e=>{d.day=+e.target.value;}},DAYS.map((n,i)=>h('option',{value:i},n)));daySel.value=d.day;
  const body=h('div',{},
    field('Przedmiot',h('input',{class:'inp',value:d.name,list:'subjlist',placeholder:'np. Statystyka',oninput:e=>{d.name=e.target.value;}}),h('datalist',{id:'subjlist'},subjects().map(s=>h('option',{value:s})))),
    field('Rodzaj',kseg),field('Dzień',daySel),
    field('Godziny',h('div',{class:'inrow'},h('input',{class:'inp',type:'time',value:d.start,onchange:e=>{d.start=e.target.value;}}),h('input',{class:'inp',type:'time',value:d.end,onchange:e=>{d.end=e.target.value;}}))),
    field('Sala',h('input',{class:'inp',value:d.room,placeholder:'np. 3P',oninput:e=>{d.room=e.target.value;}})),
    !isNew?h('div',{class:'field'},h('button',{class:'bigbtn danger',onclick:async()=>{if(confirm('Usunąć te zajęcia z planu? Notatki z poprzednich tygodni zostaną zachowane.')){S.schedule=S.schedule.filter(x=>x.id!==c.id);await saveSchedule();s.close();render();}}},'Usuń z planu')):null);
  const s=sheet({title:isNew?'Nowe zajęcia':'Edytuj zajęcia',body,left:'Anuluj',right:'Zapisz',full:true,
    onRight:async()=>{d.name=d.name.trim();if(!d.name){alert('Podaj nazwę przedmiotu.');return false;}if(!d.start||!d.end){alert('Podaj godziny.');return false;}
      if(isNew)S.schedule.push(d);else Object.assign(c,d);await saveSchedule();render();toast('Zapisano');}});
}

/* ---- backup ---- */
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(b);});
const b64ToBlob=(b,type)=>{const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type});};
async function exportBackup(){
  toast('Przygotowuję kopię…');
  const files=[];for(const f of await dbAll('files'))files.push({id:f.id,name:f.name,type:f.type,size:f.size,created:f.created,data:await blobToB64(f.blob)});
  const data={app:'notatnik-studiow',version:2,exported:new Date().toISOString(),settings:S.settings,schedule:S.schedule,tasks:S.tasks,notes:[...S.notes.values()],study:S.study,files};
  await shareBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),`notatnik-kopia-${todayISO()}.json`,'application/json');
}
async function importBackup(file){
  let data;try{data=JSON.parse(await file.text());}catch(e){alert('To nie jest poprawny plik kopii.');return;}
  if(data.app!=='notatnik-studiow'){alert('To nie jest kopia z tej aplikacji.');return;}
  if(!confirm(`Zaimportować kopię z ${new Date(data.exported).toLocaleString('pl-PL')}?\n\nNotatki i zadania zostaną połączone z obecnymi (te same pozycje zostaną nadpisane). Plan zajęć i ustawienia zostaną zastąpione.`))return;
  for(const f of data.files||[])await dbPut('files',{id:f.id,name:f.name,type:f.type,size:f.size,created:f.created,blob:b64ToBlob(f.data,f.type)});
  for(const t of data.tasks||[])await dbPut('tasks',migrateTask(t)[0]);
  for(const n of data.notes||[])await dbPut('notes',n);
  if(data.schedule)await dbPut('kv',data.schedule,'schedule');
  if(data.settings)await dbPut('kv',{...DEFAULT_SETTINGS,...data.settings},'settings');
  if(data.study){const have=new Set(S.study.map(x=>x.at));await dbPut('kv',[...S.study,...data.study.filter(x=>!have.has(x.at))],'study');}
  await load();render();toast('Zaimportowano kopię ✓');
}

/* ---------- start ---------- */
(async()=>{
  try{await load();}catch(e){document.body.innerHTML='<p style="padding:40px;font-family:system-ui">Nie udało się otworzyć bazy danych. Upewnij się, że Safari nie jest w trybie prywatnym.</p>';return;}
  render();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  let last=todayISO();
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden)return;
    if(todayISO()!==last){last=todayISO();if(!document.querySelector('.ov'))render();}
  });
})();
</script>
